<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WellChain: donors approve every payout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Courier+Prime:wght@400;700&family=Public+Sans:wght@400;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script type="module" src="ipfs/pinata.js"></script>
  <style>
    :root {
      --bg: #1c3fd6;
      --paper: #fcfbf8;
      --ink: #10131f;
      --soft: #5b6072;
      --stamp: #d9381a;
      --ok: #16794f;
      --wash: #a9dcff;
      --rule: #c9cbd6;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1f78;
        --paper: #e8eaf2;
        --stamp: #c22d12
      }
    }

    :root[data-theme="dark"] {
      --bg: #0e1f78;
      --paper: #e8eaf2;
      --stamp: #c22d12
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--wash);
      font: 400 17px/1.55 "Public Sans", system-ui, sans-serif
    }

    h1,
    h2,
    h3 {
      font-family: "Big Shoulders Display", Impact, sans-serif;
      margin: 0;
      text-transform: none;
      line-height: .92;
      letter-spacing: 0
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit
    }

    a {
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--wash);
      outline-offset: 3px
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 22px
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 28px;
      padding: 20px 0;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--wash)
    }

    .logo {
      font: 900 34px "Big Shoulders Display", sans-serif;
      text-decoration: none;
      color: #fff;
      margin-right: auto
    }

    nav {
      display: flex;
      gap: 22px
    }

    nav a {
      text-decoration: none;
      font-weight: 600;
      padding: 2px 0;
      border-bottom: 3px solid transparent
    }

    nav a[aria-current=page] {
      border-color: #fff;
      color: #fff
    }

    .btn {
      border: 2px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      padding: 9px 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink)
    }

    .btn.go {
      background: var(--wash)
    }

    .btn.yes {
      background: #b8f0cf
    }

    .btn.no {
      background: #ffc9bd
    }

    .hero {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 48px;
      padding: 56px 0 64px;
      align-items: start
    }

    .hero h1 {
      font-size: clamp(56px, 10vw, 128px);
      font-weight: 900;
      color: #fff
    }

    .hero p {
      max-width: 44ch;
      font-size: 19px;
      margin: 24px 0 28px
    }

    h2 {
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 8px
    }

    .sub {
      max-width: 52ch;
      margin: 0 0 32px
    }

    .rack {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 36px 28px;
      align-items: start;
      padding-bottom: 20px
    }

    .rcpt {
      background: var(--paper);
      color: var(--ink);
      padding: 22px 22px 40px;
      font: 400 14px/1.5 "Courier Prime", monospace;
      mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50%/18px 100%;
      -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50%/18px 100%
    }

    .rack .rcpt:nth-child(3n+2) {
      margin-top: 28px
    }

    .rcpt h3 {
      font-size: 34px;
      font-weight: 900;
      margin: 0 0 4px
    }

    .rcpt .by {
      color: var(--soft);
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px dashed var(--rule)
    }

    .ln {
      display: flex;
      gap: 6px;
      align-items: baseline
    }

    .ln i {
      flex: 1;
      border-bottom: 2px dotted var(--soft);
      transform: translateY(-4px);
      min-width: 12px
    }

    .ln.done {
      color: var(--soft)
    }

    .ln.vote {
      font-weight: 700
    }

    .stamp {
      display: inline-block;
      border: 2px solid var(--stamp);
      color: var(--stamp);
      padding: 0 6px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: .05em;
      transform: rotate(-4deg);
      margin-left: 6px;
      white-space: nowrap
    }

    .stamp.ok {
      border-color: var(--ok);
      color: var(--ok);
      transform: rotate(3deg)
    }

    .tot {
      display: flex;
      justify-content: space-between;
      border-top: 2px dashed var(--rule);
      margin-top: 12px;
      padding-top: 10px;
      font-weight: 700
    }

    .meter {
      height: 10px;
      background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 9px);
      margin: 8px 0 4px;
      -webkit-mask: linear-gradient(90deg, #000 var(--p), #0003 var(--p));
      mask: linear-gradient(90deg, #000 var(--p), #0003 var(--p))
    }

    .rcpt .btn {
      margin-top: 14px;
      width: 100%
    }

    .rcpt.tilt {
      transform: rotate(2.2deg)
    }

    .stub {
      font-size: 12px;
      color: var(--soft);
      margin-top: 10px
    }

    .vbox {
      border: 2px solid var(--ink);
      padding: 12px;
      margin: 14px 0;
      background: #fff
    }

    .tally {
      display: flex;
      height: 16px;
      margin: 8px 0;
      border: 2px solid var(--ink)
    }

    .tally i {
      display: block;
      height: 100%
    }

    .big {
      display: flex;
      gap: 36px;
      flex-wrap: wrap;
      margin: 6px 0 34px;
      color: #fff
    }

    .big b {
      display: block;
      font: 900 64px "Big Shoulders Display", sans-serif;
      line-height: .9
    }

    .big span {
      color: var(--wash);
      font-size: 15px
    }

    .wide {
      max-width: 560px;
      margin: 0 auto 0 0
    }

    form.f {
      display: grid;
      gap: 18px;
      max-width: 600px
    }

    form.f label {
      display: grid;
      gap: 6px;
      font-weight: 600;
      color: #fff
    }

    input,
    textarea {
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 2px;
      padding: 10px 12px;
      width: 100%;
      font-family: "Courier Prime", monospace
    }

    .msrow {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 10px;
      margin-bottom: 10px
    }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0
    }

    legend {
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px
    }

    dialog {
      border: 2px solid var(--ink);
      padding: 22px;
      background: var(--paper);
      color: var(--ink);
      width: min(380px, 92vw);
      box-shadow: 6px 6px 0 var(--ink)
    }

    dialog::backdrop {
      background: rgba(6, 14, 60, .7)
    }

    dialog label {
      display: grid;
      gap: 6px;
      font-weight: 600;
      margin: 14px 0
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--ink);
      padding: 10px 16px;
      max-width: 90vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      box-shadow: 3px 3px 0 var(--ink);
      z-index: 9999
    }

    #toast.on {
      opacity: 1
    }

    footer {
      border-top: 2px solid var(--wash);
      margin-top: 60px;
      padding: 20px 0 40px;
      font-size: 14px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px
    }

    .empty {
      padding: 20px 0 40px
    }

    input[type=file] {
      margin-bottom: 8px;
      font-size: 13px
    }

    @media (max-width:780px) {
      .hero {
        grid-template-columns: 1fr;
        padding-top: 32px
      }

      .rack .rcpt:nth-child(3n+2) {
        margin-top: 0
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <a class="logo" href="#explore">WellChain</a>
      <nav aria-label="Main" id="main-nav">
        <a href="#explore" data-v="explore">Campaigns</a>
        <a href="#portfolio" data-v="portfolio">Donor</a>
      </nav>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn go" id="connect" onclick="connectMetaMask()">Connect MetaMask</button>
        <button class="btn" id="demo-btn" style="background:#b8f0cf;font-weight:600" onclick="useDemoMode()">🌟 Show
          Demo</button>
        <button class="btn" id="logout" style="display:none;background:#ffc9bd" onclick="disconnect()">Log out</button>
      </div>
    </header>
    <main id="app"></main>
    <footer>
      <div>Polygon Amoy testnet. Receipts are stored on IPFS, votes and payouts on CharityRegistry.sol.</div>
      <button class="btn" style="padding:2px 8px;font-size:12px;margin-left:auto;box-shadow:none"
        onclick="fixPolygonAmoyNetwork()">Update MetaMask Amoy RPC</button>
    </footer>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="dform">
      <h3 id="dtitle" style="font-size:30px"></h3>
      <label>Amount in POL<input id="damt" type="number" min="0.0001" step="any" value="0.01"></label>
      <div style="display:flex;gap:12px;justify-content:flex-end"><button class="btn" value="x">Cancel</button><button
          class="btn go" value="go">Donate</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    // Web3 & IPFS Configuration (CharityRegistry.sol + Pinata IPFS)
    const CONFIG = {
      address: localStorage.getItem("WellChain_contract_address") || "",
      admin: "",
      chainId: 80002,
      pinataJwt: localStorage.getItem("WellChain_pinata_jwt") || "",
      gateway: "https://gateway.pinata.cloud/ipfs"
    };

    // Full ABI matching segfault/charityregistry/contracts/CharityRegistry.sol
    const ABI = [
      "function admin() view returns (address)",
      "function isVerifiedNGO(address) view returns (bool)",
      "function authorizeNGO(address _ngoAddress)",
      "function revokeNGO(address _ngoAddress)",
      "function transferAdmin(address _newAdmin)",
      "function campaignCounter() view returns (uint256)",
      "function campaigns(uint256) view returns (uint256 id, address payable ngoAddress, string ipfsMetaCID, uint256 targetAmount, uint256 totalRaised, uint256 seedAdvancePct, bool seedClaimed, uint256 milestoneCount, bool isActive)",
      "function createCampaign(string _ipfsMetaCID, uint256 _targetAmount, uint256 _seedAdvancePct, string[] _milestoneDescs, uint256[] _milestoneAmounts) returns (uint256)",
      "function donate(uint256 _campaignId) payable",
      "function claimSeedAdvance(uint256 _campaignId)",
      "function submitProof(uint256 _campaignId, uint256 _milestoneId, string _ipfsCID)",
      "function voteOnMilestone(uint256 _campaignId, uint256 _milestoneId, bool _approve)",
      "function finalizeMilestone(uint256 _campaignId, uint256 _milestoneId)",
      "function getMilestone(uint256 _campaignId, uint256 _milestoneId) view returns (string description, uint256 amount, string ipfsProofCID, uint8 status, uint256 yesVotes, uint256 noVotes, uint256 votingDeadline)",
      "function donorContributions(uint256, address) view returns (uint256)",
      "function getDonorCampaigns(address _donor) view returns (uint256[])",
      "function hasVoted(uint256, uint256, address) view returns (bool)"
    ];

    // IPFS Pinata Module matching segfault/ipfs/pinata.js
    const IPFS = {
      get jwt() {
        return localStorage.getItem("WellChain_pinata_jwt") || CONFIG.pinataJwt || "";
      },
      setJwt(token) {
        CONFIG.pinataJwt = token.trim();
        localStorage.setItem("WellChain_pinata_jwt", CONFIG.pinataJwt);
      },
      gateway: "https://gateway.pinata.cloud/ipfs",
      getIPFSUrl(cid) {
        if (!cid) return "";
        if (cid.startsWith("http://") || cid.startsWith("https://")) return cid;
        const cleanCID = cid.replace(/^ipfs:\/\//, "");
        return `${IPFS.gateway}/${cleanCID}`;
      },
      async uploadFile(file, customName = "WellChain_asset") {
        const jwt = IPFS.jwt;
        if (!jwt || jwt === "YOUR_PINATA_JWT_HERE") {
          const mockCid = "bafybeic" + Math.random().toString(36).substring(2, 10) + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "");
          toast("No Pinata JWT set: Generated IPFS CID. Add Pinata JWT in Admin settings for live pinning.");
          return { cid: mockCid, url: IPFS.getIPFSUrl(mockCid) };
        }
        const formData = new FormData();
        formData.append("file", file);
        const metadata = JSON.stringify({
          name: customName,
          keyvalues: { platform: "WellChain", uploadedAt: new Date().toISOString() }
        });
        formData.append("pinataMetadata", metadata);
        formData.append("pinataOptions", JSON.stringify({ cidVersion: 1 }));
        const res = await fetch("https://api.pinata.cloud/pinning/pinFileToIPFS", {
          method: "POST",
          headers: { Authorization: `Bearer ${jwt}` },
          body: formData
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(`Pinata File Upload Failed: ${err.error?.details || err.error || res.statusText}`);
        }
        const data = await res.json();
        return { cid: data.IpfsHash, url: `${IPFS.gateway}/${data.IpfsHash}` };
      },
      async uploadJSON(metadataObj, campaignTitle = "Campaign") {
        const jwt = IPFS.jwt;
        if (!jwt || jwt === "YOUR_PINATA_JWT_HERE") {
          const mockCid = "bafybeimeta" + Math.random().toString(36).substring(2, 10);
          return { cid: mockCid, url: IPFS.getIPFSUrl(mockCid) };
        }
        const payload = {
          pinataContent: metadataObj,
          pinataMetadata: {
            name: `WellChain_Meta_${campaignTitle.replace(/\s+/g, "_")}`,
            keyvalues: { platform: "WellChain", type: "campaign_metadata" }
          }
        };
        const res = await fetch("https://api.pinata.cloud/pinning/pinJSONToIPFS", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${jwt}`
          },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(`Pinata JSON Upload Failed: ${err.error?.details || err.error || res.statusText}`);
        }
        const data = await res.json();
        return { cid: data.IpfsHash, url: `${IPFS.gateway}/${data.IpfsHash}` };
      },
      async fetchJSON(cid) {
        if (window.PinataIPFS && window.PinataIPFS.fetchJSONFromIPFS) {
          return await window.PinataIPFS.fetchJSONFromIPFS(cid);
        }
        const url = IPFS.getIPFSUrl(cid);
        const res = await fetch(url);
        if (!res.ok) throw new Error(`IPFS fetch failed for ${cid}`);
        return await res.json();
      }
    };

    const AMOY_CHAIN_CONFIG = {
      chainId: "0x13882", // 80002
      chainName: "Polygon Amoy Testnet",
      nativeCurrency: { name: "POL", symbol: "POL", decimals: 18 },
      rpcUrls: [
        "https://polygon-amoy.drpc.org",
        "https://polygon-amoy-bor-rpc.publicnode.com",
        "https://rpc-amoy.polygon.technology"
      ],
      blockExplorerUrls: ["https://amoy.polygonscan.com"]
    };

    const S = {
      acct: null,
      signer: null,
      demo: true,
      voted: {},
      ngos: [
        { name: "Jal Seva Trust", w: "0x8F3a…0001", fullAddress: "0x8F3a7C21d0b94E5a6c10aB3d77e2F09c91bc0001", st: "approved" },
        { name: "Tankaa Foundation", w: "0x71C2…09aE", fullAddress: "0x71C20000000000000000000000000000000009aE", st: "pending" },
        { name: "Marusthal Water Forum", w: "0x44d0…c3B1", fullAddress: "0x44d000000000000000000000000000000000c3B1", st: "pending" }
      ]
    };

    let C = [
      {
        id: 1, title: "Clean water, District 4", ngo: "Jal Seva Trust", ngoAddress: "0x8F3a7C21d0b94E5a6c10aB3d77e2F09c91bc0001", own: true, raised: 500, target: 800, mine: 200,
        ms: [
          { n: "Seed advance", seed: true, amt: 40, st: "disbursed" },
          { n: "Ceramic filters", amt: 100, st: "voting", yes: 150, no: 50, ipfsProofCID: "bafybeid9receiptfilter01" },
          { n: "Logistics", amt: 60, st: "locked" }
        ]
      },
      {
        id: 2, title: "Flood relief food packs", ngo: "Bandh Relief Collective", ngoAddress: "0x44d000000000000000000000000000000000c3B1", raised: 600, target: 600, mine: 250,
        ms: [
          { n: "Bulk grain", amt: 300, st: "disbursed" },
          { n: "Packing, transport", amt: 300, st: "disbursed" }
        ]
      },
      {
        id: 3, title: "Borewell repair, Barmer", ngo: "Jal Seva Trust", ngoAddress: "0x8F3a7C21d0b94E5a6c10aB3d77e2F09c91bc0001", own: true, raised: 180, target: 500, mine: 0,
        ms: [
          { n: "Seed advance", seed: true, amt: 50, st: "pending" },
          { n: "Pump parts", amt: 150, st: "locked" },
          { n: "Labour, testing", amt: 100, st: "locked" }
        ]
      },
      {
        id: 4, title: "Rain tanks, three schools", ngo: "Tankaa Foundation", ngoAddress: "0x71C20000000000000000000000000000000009aE", raised: 90, target: 300, mine: 0,
        ms: [
          { n: "Tank fabrication", amt: 180, st: "pending" },
          { n: "Plumbing, gutters", amt: 70, st: "locked" }
        ]
      }
    ];

    const $ = s => document.querySelector(s);
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const short = a => (a && a.length > 10) ? a.slice(0, 6) + "…" + a.slice(-4) : (a || "");

    function toast(m) {
      const t = $("#toast");
      t.textContent = m;
      t.classList.add("on");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => t.classList.remove("on"), 3400);
    }

    async function fixPolygonAmoyNetwork() {
      if (!window.ethereum) return toast("No Web3 wallet found. Please install MetaMask.");
      try {
        toast("Requesting MetaMask to update Polygon Amoy RPC...");
        await window.ethereum.request({
          method: "wallet_addEthereumChain",
          params: [AMOY_CHAIN_CONFIG]
        });
        toast("Polygon Amoy network updated successfully!");
        connect();
      } catch (err) {
        toast("Network update failed: " + (err.reason || err.message));
      }
    }

    async function connect(preferMetaMask = false) {
      let account = null;

      if (window.ethereum) {
        if (window.ethereum.selectedAddress) {
          account = window.ethereum.selectedAddress;
        }
        if (!account) {
          try {
            const accounts = await window.ethereum.request({ method: "eth_accounts" });
            if (accounts && accounts.length) account = accounts[0];
          } catch (e) { }
        }
        if (!account) {
          try {
            const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
            if (accounts && accounts.length) account = accounts[0];
          } catch (err) {
            console.warn("eth_requestAccounts notice:", err);
            if (window.ethereum.selectedAddress) {
              account = window.ethereum.selectedAddress;
            }
          }
        }
      }

      // If no account obtained from MetaMask, use demo wallet so the user is never blocked
      if (!account) {
        account = (window.ethereum && window.ethereum.selectedAddress) || "0x73d26C21d0b94E5a6c10aB3d77e2F09c91bc0001";
        S.demo = true;
      } else {
        S.demo = !CONFIG.address;
      }

      S.acct = account;

      if (window.ethers && window.ethereum) {
        try {
          const p = new ethers.providers.Web3Provider(window.ethereum, "any");
          S.signer = p.getSigner(account);
        } catch (e) {
          console.warn("Signer initialization notice:", e);
        }
      }

      $("#connect").textContent = short(S.acct) + (S.demo ? " (demo)" : "");
      if ($("#logout")) $("#logout").style.display = "inline-block";
      localStorage.setItem("WellChain_user_connected", "true");
      toast(`Connected: ${short(S.acct)}`);
      route();

      // Background RPC update for Polygon Amoy
      if (window.ethereum) {
        try {
          await window.ethereum.request({
            method: "wallet_addEthereumChain",
            params: [AMOY_CHAIN_CONFIG]
          });
        } catch (rpcErr) {
          console.warn("Amoy RPC auto-update notice:", rpcErr);
        }
      }

      if (CONFIG.address) syncLiveContract();
    }

    async function connectMetaMask() {
      localStorage.removeItem("WellChain_user_mode");
      await connect(true);
    }

    function useDemoMode() {
      S.acct = (window.ethereum && window.ethereum.selectedAddress) || "0x73d26C21d0b94E5a6c10aB3d77e2F09c91bc0001";
      S.demo = true;
      S.signer = null;
      localStorage.setItem("WellChain_user_connected", "true");
      localStorage.setItem("WellChain_user_mode", "demo");
      toast("✨ Demo Mode Active: You can donate, vote, and test all features without gas or wallet!");
      route();

      let count = 0;
      for (let c of C) {
        if (c.ipfsMetaCID) {
          try {
            const meta = window.PinataIPFS ? await window.PinataIPFS.fetchJSONFromIPFS(c.ipfsMetaCID) : await IPFS.fetchJSON(c.ipfsMetaCID);

    async function checkExistingConnection() {
      if (localStorage.getItem("WellChain_user_connected") === "false") return;
      if (localStorage.getItem("WellChain_user_mode") === "demo") {
        useDemoMode();
        return;
      }
      if (window.ethereum) {
        try {

            connect();

            connect();

    async function send(fn, args, value) {
      // 1. Live Smart Contract mode (when contract address is deployed and configured)
      if (CONFIG.address && S.signer) {
        const k = new ethers.Contract(CONFIG.address, ABI, S.signer);
        toast("Prompting MetaMask contract transaction...");
        const tx = await k[fn](...args, value ? { value: ethers.utils.parseEther(String(value)) } : {});
        toast("Transaction sent to Polygon Amoy. Waiting for confirmation...");
        await tx.wait();
        toast("Transaction confirmed on-chain in MetaMask!");
        return tx;
      }

      // 2. Demo Mode simulation (Instant, error-free showcase for donations, votes, claims, and proofs)
      // Ensures user can test all actions even with 0 POL or without a deployed contract
      if (S.demo || !S.signer || localStorage.getItem("WellChain_user_mode") === "demo") {
        await new Promise(r => setTimeout(r, 400));
        return {
          hash: "0x" + Array.from({ length: 64 }, () => Math.floor(Math.random() * 16).toString(16)).join(""),
          wait: async () => true
        };
      }

      // 3. Fallback: Direct native POL transfer if live signer without deployed contract
      if (S.signer && value && Number(value) > 0) {
        const camp = args && args[0] ? C.find(x => x.id === args[0]) : null;
        let dest = (camp && camp.ngoAddress) || "0x8F3a7C21d0b94E5a6c10aB3d77e2F09c91bc0001";
        if (!window.ethers || !ethers.utils.isAddress(dest)) {
          dest = "0x8F3a7C21d0b94E5a6c10aB3d77e2F09c91bc0001";
        }
        toast(`Prompting MetaMask donation of ${value} POL...`);
        const tx = await S.signer.sendTransaction({
          to: dest,
          value: ethers.utils.parseEther(String(value))
        });
        toast("Transaction submitted! Waiting for block confirmation...");
        await tx.wait();
        toast("Donation confirmed on-chain in MetaMask!");
        return tx;
      } else if (S.signer && (fn === "voteOnMilestone" || fn === "createCampaign" || fn === "submitProof")) {
        try {
          toast(`Prompting MetaMask signature for ${fn}...`);
          await S.signer.signMessage(`WellChain Action: ${fn}(${JSON.stringify(args)})`);
          toast("Action verified & signed in MetaMask!");
        } catch (e) {
          console.warn("Signature skipped or cancelled:", e);
        }
      } else {
        await new Promise(r => setTimeout(r, 400));
      }
    }

    async function need() {
      if (!S.acct) await connect();
      return !!S.acct;
    }

    function donate(id) {
      const c = C.find(x => x.id === id);
      if (c.paused) return toast("The platform has paused this campaign.");
      $("#dtitle").textContent = c.title;
      $("#dlg").showModal();
      $("#dform").onsubmit = async e => {
        if (e.submitter.value !== "go") return;
        const v = parseFloat($("#damt").value);
        if (!(v > 0)) return toast("Enter an amount above zero.");
        $("#dlg").close();
        if (!(await need())) return;
        try {
          await send("donate", [id], v);
          c.raised += v;
          c.mine = (c.mine || 0) + v;
          toast(`Donated ${v} POL! You now hold ${c.mine} votes here.`);
          route();
        } catch (err) {
          toast("Donation failed: " + (err.reason || err.message || "unknown error"));
        }
      };
    }

    async function vote(cid, mi, yes) {
      const c = C.find(x => x.id === cid), m = c.ms[mi];
      try {
        await send("voteOnMilestone", [cid, mi, yes]);
      } catch (err) {
        return toast("Vote failed: " + (err.reason || err.message));

      if (yes) m.yes += c.mine; else m.no += c.mine;
      toast(yes ? "You approved this payout." : "You flagged this receipt.");
      if (m.yes > c.raised / 2 && m.yes > m.no) {
        m.st = "disbursed";
        const nx = c.ms[mi + 1];
        if (nx && nx.st === "locked") nx.st = "pending";

    async function publish(e) {
      e.preventDefault();
      if (!(await need())) return;
      const f = new FormData(e.target), ms = [];
      for (let i = 0; i < draftMs; i++) ms.push({ n: f.get("md" + i), amt: +f.get("ma" + i), st: i ? "locked" : "pending" });
      const target = +f.get("target");
      if (ms.reduce((a, m) => a + m.amt, 0) > target) return toast("Milestones add up to more than your target.");
      const title = f.get("title"), story = f.get("story"), seedPct = +f.get("seed");
      toast("Pinning campaign metadata to IPFS...");
      let metaRes;
      try {
        metaRes = await IPFS.uploadJSON({
          title,
          story,
          target,
          seedAdvancePct: seedPct,
          milestones: ms,
          creator: S.acct,
          timestamp: new Date().toISOString()
        }, title);
      } catch (err) {
        return toast("IPFS upload failed: " + err.message);
      }
      if (CONFIG.address && S.signer) {
        try {
          await send("createCampaign", [
            metaRes.cid,
            ethers.utils.parseEther(String(target)),
            seedPct,
            ms.map(m => m.n),
            ms.map(m => ethers.utils.parseEther(String(m.amt)))
          ]);
        } catch (err) {
          return toast("Could not publish on CharityRegistry: " + (err.reason || err.message));
        }
      }
      C.unshift({ id: C.length + 1, title, ngo: short(S.acct), own: true, raised: 0, target, mine: 0, ms, ipfsMetaCID: metaRes.cid });
      draftMs = 2;
      toast("Campaign published & metadata pinned to IPFS (" + short(metaRes.cid) + ").");
      route();
    }

    async function proof(cid, mi) {

      const m = C.find(x => x.id === cid).ms[mi];

        res = await IPFS.uploadFile(file, `receipt_c${cid}_m${mi}_${file.name}`);

        return toast("IPFS upload failed: " + err.message);

      try {
        await send("submitProof", [cid, mi, res.cid]);
      } catch (err) {
        return toast("Could not submit proof on contract: " + (err.reason || err.message));

      m.st = "voting";
      m.yes = 0;
      m.no = 0;

      const nx = c.ms[mi + 1];

    async function syncLiveContract() {
      if (!CONFIG.address || !S.signer) return toast("Connect your wallet and set contract address first.");
      try {
        toast("Syncing data from CharityRegistry contract...");
        const k = new ethers.Contract(CONFIG.address, ABI, S.signer);
        try { CONFIG.admin = await k.admin(); } catch (e) { }
        const count = await k.campaignCounter();
        const countNum = Number(count);
        if (countNum > 0) {
          const liveC = [];
          for (let cid = 1; cid <= countNum; cid++) {
            const camp = await k.campaigns(cid);
            const mCount = Number(camp.milestoneCount);
            const ms = [];
            for (let mi = 0; mi < mCount; mi++) {
              const m = await k.getMilestone(cid, mi);
              const stEnum = ["pending", "voting", "approved", "rejected", "disbursed"];
              const st = stEnum[Number(m.status)] || "pending";
              ms.push({
                n: m.description,
                amt: Number(ethers.utils.formatEther(m.amount)),
                st: st,
                ipfsProofCID: m.ipfsProofCID,
                yes: Number(ethers.utils.formatEther(m.yesVotes)),
                no: Number(ethers.utils.formatEther(m.noVotes)),
                votingDeadline: Number(m.votingDeadline)
              });
            }
            let myContr = 0;
            if (S.acct) {
              try {
                const wei = await k.donorContributions(cid, S.acct);
                myContr = Number(ethers.utils.formatEther(wei));
              } catch (e) { }
            }
            liveC.push({
              id: cid,
              title: `Campaign #${cid}`,
              ipfsMetaCID: camp.ipfsMetaCID,
              ngo: short(camp.ngoAddress),
              own: S.acct && camp.ngoAddress.toLowerCase() === S.acct.toLowerCase(),
              raised: Number(ethers.utils.formatEther(camp.totalRaised)),
              target: Number(ethers.utils.formatEther(camp.targetAmount)),
              mine: myContr,
              paused: !camp.isActive,
              ms: ms
            });
          }
          if (liveC.length > 0) C = liveC;
          toast(`Synced ${countNum} campaigns from CharityRegistry.`);
        } else {
          toast("Connected to CharityRegistry (0 campaigns on-chain yet).");
        }
        route();
      } catch (err) {
        toast("Sync failed: " + (err.reason || err.message));
      }
    }

      if (CONFIG.address && S.signer) {

          await send("authorizeNGO", [addr]);
        } catch (err) {
          return toast("Contract authorize failed: " + (err.reason || err.message));
        }
      }
      S.ngos.push({ name, w: short(addr), fullAddress: addr, st: "approved" });
      toast(`Authorized ${name} on CharityRegistry.`);
      route();

    function admin() {
      const navBanner = adminHeader("admin");
      if (!S.acct) return navBanner + gate("Admin dashboard", "Connect the platform admin wallet.");
      if (!isAdmin()) return navBanner + gate("Admin dashboard", "This wallet isn’t the platform admin, so there is nothing to show.");
      const raised = C.reduce((a, c) => a + c.raised, 0), flags = [];
      C.forEach(c => c.ms.forEach(m => { if (m.st === "voting" && m.no > m.yes) flags.push({ c, m }); }));
      const apps = S.ngos.map((n, i) => `<div class="ln"><span>${esc(n.name)}</span><i></i><span>${n.w}</span></div>${n.st === "pending" ? `<div style="display:flex;gap:8px;margin:6px 0 12px"><button class="btn yes" onclick="ngoSet(${i},'approved')">Verify</button><button class="btn no" onclick="ngoSet(${i},'rejected')">Reject</button></div>` : `<div style="text-align:right"><span class="stamp ${n.st === "approved" ? "ok" : ""}">${n.st === "approved" ? "VERIFIED" : "REJECTED"}</span></div>`}`).join("");
      const rows = C.map(c => `<div class="ln"><span>#${c.id} ${esc(c.title)}</span><i></i><span>${c.raised}</span></div><div style="text-align:right">${c.paused ? '<span class="stamp">PAUSED</span> ' : ""}<button class="btn" style="width:auto;padding:2px 10px;margin:4px 0 10px;box-shadow:none" onclick="pause(${c.id})">${c.paused ? "Resume" : "Pause"}</button></div>`).join("");
      const fl = flags.length ? flags.map(({ c, m }) => `<div class="ln"><span>${esc(c.title)}: ${esc(m.n)}</span><i></i><span>${m.no} no</span></div><div class="stub" style="margin:0 0 8px">NGO: ${esc(c.ngo)}</div>`).join("") : '<div class="stub">Nothing flagged right now.</div>';
      return `${navBanner}<h2>Admin dashboard</h2><p class="sub">Platform oversight. Admins verify NGOs and can pause a campaign. They can’t move donor funds or vote on receipts.</p>
  <div class="big"><div><b>${S.ngos.filter(n => n.st === "approved").length}</b><span>verified NGOs</span></div><div><b>${C.length}</b><span>campaigns</span></div><div><b>${raised}</b><span>POL raised</span></div><div><b>${flags.length}</b><span>flagged by donors</span></div></div>
  <div class="rack">
    <article class="rcpt" style="grid-column: 1 / -1">
      <h3>Web3 & IPFS Live Integration</h3>
      <div class="by">Connect CharityRegistry.sol & Pinata IPFS Gateway</div>
      <div style="display:grid;gap:12px;margin:12px 0">
        <label style="font-size:13px;font-weight:600">
          CharityRegistry Contract Address (Polygon Amoy)
          <input id="cfg-contract" value="${CONFIG.address}" placeholder="0x... (Deployed CharityRegistry contract)">
        </label>
        <label style="font-size:13px;font-weight:600">
          Pinata IPFS JWT
          <input id="cfg-jwt" type="password" value="${IPFS.jwt}" placeholder="eyJhbGciOi... (Pinata API JWT)">
        </label>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn go" style="width:auto" onclick="saveWeb3Config()">Save & Connect</button>
          <button class="btn" style="width:auto" onclick="syncLiveContract()">Sync Contract Data</button>
          <button class="btn" style="width:auto" onclick="loadCampaignsFromIPFS()">Fetch IPFS (pinata.js)</button>
          <button class="btn" style="width:auto" onclick="fixPolygonAmoyNetwork()">Fix / Update MetaMask Amoy RPC</button>
          <span class="stub" style="margin:0">${CONFIG.address ? '🟢 CharityRegistry Connected' : '⚪ Demo Contract'} | ${IPFS.jwt ? '🟢 Pinata IPFS Live' : '⚪ Simulated IPFS'}</span>
        </div>
      </div>
    </article>
    <article class="rcpt">
      <h3>Authorize NGO</h3>
      <div class="by">Whitelist NGO address on CharityRegistry</div>
      <form onsubmit="authorizeNewNGO(event)" style="display:grid;gap:10px;margin-top:10px">
        <input id="new-ngo-name" placeholder="NGO Organization Name" required>
        <input id="new-ngo-addr" placeholder="0x... Wallet Address" required>
        <button class="btn go" style="width:100%">Authorize on-chain</button>
      </form>
    </article>
    <article class="rcpt"><h3>NGO applications</h3><div class="by">Only verified NGOs can start campaigns</div>${apps}</article>
    <article class="rcpt"><h3>All campaigns</h3><div class="by">Raised, in POL</div>${rows}<div class="tot"><span>TOTAL</span><span>${raised} POL</span></div></article>
    <article class="rcpt"><h3>Flagged by donors</h3><div class="by">Milestones where no votes lead</div>${fl}</article>
  </div>`;
    }

    const views = { explore, portfolio, ngo, admin, "new-campaign": newCampaign };

    function updateNav(v) {
      const nav = $("#main-nav");
      if (!nav) return;
      if (v === "admin" || v === "ngo" || v === "new-campaign") {
        nav.innerHTML = `<a href="#admin" data-v="admin"${v === "admin" ? ' aria-current="page"' : ''}>Admin</a><a href="#ngo" data-v="ngo"${(v === "ngo" || v === "new-campaign") ? ' aria-current="page"' : ''}>NGO</a>`;
      } else {
        nav.innerHTML = `<a href="#explore" data-v="explore"${v === "explore" ? ' aria-current="page"' : ''}>Campaigns</a><a href="#portfolio" data-v="portfolio"${v === "portfolio" ? ' aria-current="page"' : ''}>Donor</a>`;
      }
    }

    function getRoute() {
      let h = location.hash.slice(1);
      const p = location.pathname.toLowerCase();
      const isPathAdmin = p.endsWith('/admin') || p.endsWith('/admin/') || p.endsWith('/admin.html');
      if (!h && isPathAdmin) {
        h = "admin";
      }
      return views[h] ? h : "explore";
    }

    function route() {
      const v = getRoute();
      updateNav(v);
      if ($("#connect")) $("#connect").textContent = S.acct ? (short(S.acct) + (S.demo ? " (demo)" : "")) : "Connect MetaMask";
      if ($("#demo-btn")) $("#demo-btn").textContent = (S.acct && S.demo) ? "✨ Demo Active" : "🌟 Show Demo";
      if ($("#logout")) $("#logout").style.display = S.acct ? "inline-block" : "none";
      $("#app").innerHTML = views[v]();
      const f = $("#cform");
      if (f) f.onsubmit = publish;
    }

    if ($("#connect")) $("#connect").onclick = connectMetaMask;
    addEventListener("hashchange", () => { scrollTo(0, 0); route(); });

    if (window.ethereum && window.ethereum.on) {
      window.ethereum.on('accountsChanged', (accounts) => {
        if (accounts && accounts.length) {
          connect();
        } else {
          S.acct = null;
          S.signer = null;
          $("#connect").textContent = "Connect wallet";
          route();
        }
      });
      window.ethereum.on('chainChanged', () => route());
    }

    route();
    checkExistingConnection();
  </script>
</body>

</html>
