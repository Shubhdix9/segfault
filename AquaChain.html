<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AquaChain: donors approve every payout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Courier+Prime:wght@400;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
:root{--bg:#1c3fd6;--paper:#fcfbf8;--ink:#10131f;--soft:#5b6072;--stamp:#d9381a;--ok:#16794f;--wash:#a9dcff;--rule:#c9cbd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f78;--paper:#e8eaf2;--stamp:#c22d12}}
:root[data-theme="dark"]{--bg:#0e1f78;--paper:#e8eaf2;--stamp:#c22d12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--wash);font:400 17px/1.55 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Big Shoulders Display",Impact,sans-serif;margin:0;text-transform:none;line-height:.92;letter-spacing:0}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--wash);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
header{display:flex;align-items:baseline;gap:28px;padding:20px 0;flex-wrap:wrap;border-bottom:2px solid var(--wash)}
.logo{font:900 34px "Big Shoulders Display",sans-serif;text-decoration:none;color:#fff;margin-right:auto}
nav{display:flex;gap:22px}
nav a{text-decoration:none;font-weight:600;padding:2px 0;border-bottom:3px solid transparent}
nav a[aria-current=page]{border-color:#fff;color:#fff}
.btn{border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 16px;font-weight:600;cursor:pointer;border-radius:2px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--wash)}.btn.yes{background:#b8f0cf}.btn.no{background:#ffc9bd}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;padding:56px 0 64px;align-items:start}
.hero h1{font-size:clamp(56px,10vw,128px);font-weight:900;color:#fff}
.hero p{max-width:44ch;font-size:19px;margin:24px 0 28px}
h2{font-size:48px;font-weight:900;color:#fff;margin-bottom:8px}
.sub{max-width:52ch;margin:0 0 32px}
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:36px 28px;align-items:start;padding-bottom:20px}
.rcpt{background:var(--paper);color:var(--ink);padding:22px 22px 40px;font:400 14px/1.5 "Courier Prime",monospace;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/18px 100%;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/18px 100%}
.rack .rcpt:nth-child(3n+2){margin-top:28px}
.rcpt h3{font-size:34px;font-weight:900;margin:0 0 4px}
.rcpt .by{color:var(--soft);margin-bottom:14px;padding-bottom:12px;border-bottom:2px dashed var(--rule)}
.ln{display:flex;gap:6px;align-items:baseline}
.ln i{flex:1;border-bottom:2px dotted var(--soft);transform:translateY(-4px);min-width:12px}
.ln.done{color:var(--soft)}
.ln.vote{font-weight:700}
.stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);padding:0 6px;font-weight:700;font-size:12px;letter-spacing:.05em;transform:rotate(-4deg);margin-left:6px;white-space:nowrap}
.stamp.ok{border-color:var(--ok);color:var(--ok);transform:rotate(3deg)}
.tot{display:flex;justify-content:space-between;border-top:2px dashed var(--rule);margin-top:12px;padding-top:10px;font-weight:700}
.meter{height:10px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 9px);margin:8px 0 4px;-webkit-mask:linear-gradient(90deg,#000 var(--p),#0003 var(--p));mask:linear-gradient(90deg,#000 var(--p),#0003 var(--p))}
.rcpt .btn{margin-top:14px;width:100%}
.rcpt.tilt{transform:rotate(2.2deg)}
.stub{font-size:12px;color:var(--soft);margin-top:10px}
.vbox{border:2px solid var(--ink);padding:12px;margin:14px 0;background:#fff}
.tally{display:flex;height:16px;margin:8px 0;border:2px solid var(--ink)}
.tally i{display:block;height:100%}
.big{display:flex;gap:36px;flex-wrap:wrap;margin:6px 0 34px;color:#fff}
.big b{display:block;font:900 64px "Big Shoulders Display",sans-serif;line-height:.9}
.big span{color:var(--wash);font-size:15px}
.wide{max-width:560px;margin:0 auto 0 0}
form.f{display:grid;gap:18px;max-width:600px}
form.f label{display:grid;gap:6px;font-weight:600;color:#fff}
input,textarea{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:2px;padding:10px 12px;width:100%;font-family:"Courier Prime",monospace}
.msrow{display:grid;grid-template-columns:1fr 110px;gap:10px;margin-bottom:10px}
fieldset{border:0;padding:0;margin:0}legend{font-weight:600;color:#fff;margin-bottom:8px}
dialog{border:2px solid var(--ink);padding:22px;background:var(--paper);color:var(--ink);width:min(380px,92vw);box-shadow:6px 6px 0 var(--ink)}
dialog::backdrop{background:rgba(6,14,60,.7)}
dialog label{display:grid;gap:6px;font-weight:600;margin:14px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:10px 16px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:3px 3px 0 var(--ink)}
#toast.on{opacity:1}
footer{border-top:2px solid var(--wash);margin-top:60px;padding:20px 0 40px;font-size:14px}
.empty{padding:20px 0 40px}
input[type=file]{margin-bottom:8px;font-size:13px}
@media (max-width:780px){.hero{grid-template-columns:1fr;padding-top:32px}.rack .rcpt:nth-child(3n+2){margin-top:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="logo" href="#explore">AquaChain</a>
  <nav aria-label="Main">
    <a href="#explore" data-v="explore">Campaigns</a>
    <a href="#portfolio" data-v="portfolio">Donor</a>
    <a href="#ngo" data-v="ngo">NGO</a>
    <a href="#admin" data-v="admin">Admin</a>
  </nav>
  <button class="btn go" id="connect">Connect wallet</button>
</header>
<main id="app"></main>
<footer>Polygon Amoy testnet. Receipts are stored on IPFS, votes and payouts in the contract. Until a contract address is set in the page config, this runs as a local demo.</footer>
</div>

<dialog id="dlg"><form method="dialog" id="dform">
  <h3 id="dtitle" style="font-size:30px"></h3>
  <label>Amount in POL<input id="damt" type="number" min="1" step="1" value="25"></label>
  <div style="display:flex;gap:12px;justify-content:flex-end"><button class="btn" value="x">Cancel</button><button class="btn go" value="go">Donate</button></div>
</form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// Paste your Remix deployment here to go live
const CONFIG={address:"",admin:"",chainId:80002};
const ABI=["function submitProof(uint256,uint256,string)","function claimSeedAdvance(uint256)","function donate(uint256) payable","function voteOnMilestone(uint256,uint256,bool)","function createCampaign(string,uint256,uint256,string[],uint256[]) returns (uint256)"];
const S={acct:null,signer:null,demo:true,voted:{},ngos:[{name:"Jal Seva Trust",w:"0x8F3a…91bc",st:"approved"},{name:"Tankaa Foundation",w:"0x71C2…09aE",st:"pending"},{name:"Marusthal Water Forum",w:"0x44d0…c3B1",st:"pending"}]};
let C=[
 {id:1,title:"Clean water, District 4",ngo:"Jal Seva Trust",own:true,raised:500,target:800,mine:200,
  ms:[{n:"Seed advance",seed:true,amt:40,st:"disbursed"},{n:"Ceramic filters",amt:100,st:"voting",yes:150,no:50},{n:"Logistics",amt:60,st:"locked"}]},
 {id:2,title:"Flood relief food packs",ngo:"Bandh Relief Collective",raised:600,target:600,mine:250,
  ms:[{n:"Bulk grain",amt:300,st:"disbursed"},{n:"Packing, transport",amt:300,st:"disbursed"}]},
 {id:3,title:"Borewell repair, Barmer",ngo:"Jal Seva Trust",own:true,raised:180,target:500,mine:0,
  ms:[{n:"Seed advance",seed:true,amt:50,st:"pending"},{n:"Pump parts",amt:150,st:"locked"},{n:"Labour, testing",amt:100,st:"locked"}]},
 {id:4,title:"Rain tanks, three schools",ngo:"Tankaa Foundation",raised:90,target:300,mine:0,
  ms:[{n:"Tank fabrication",amt:180,st:"pending"},{n:"Plumbing, gutters",amt:70,st:"locked"}]}
];
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short=a=>a.slice(0,6)+"…"+a.slice(-4);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),3400)}

async function connect(){
  if(window.ethereum&&window.ethers){
    try{
      const p=new ethers.providers.Web3Provider(window.ethereum);
      await p.send("eth_requestAccounts",[]);
      try{await p.send("wallet_switchEthereumChain",[{chainId:"0x13882"}])}
      catch(e){await p.send("wallet_addEthereumChain",[{chainId:"0x13882",chainName:"Polygon Amoy",nativeCurrency:{name:"POL",symbol:"POL",decimals:18},rpcUrls:["https://rpc-amoy.polygon.technology"],blockExplorerUrls:["https://amoy.polygonscan.com"]}])}
      S.signer=new ethers.providers.Web3Provider(window.ethereum).getSigner();
      S.acct=await S.signer.getAddress();S.demo=!CONFIG.address;
    }catch(e){toast("Wallet connection was cancelled.");return}
  }else{
    S.acct="0x8F3a7C21d0b94E5a6c10aB3d77e2F09c91bc";S.demo=true;
    toast("No wallet found. Using a demo wallet.");
  }
  $("#connect").textContent=short(S.acct)+(S.demo?" (demo)":"");
  route();
}
async function send(fn,args,value){
  if(CONFIG.address&&S.signer){
    const k=new ethers.Contract(CONFIG.address,ABI,S.signer);
    const tx=await k[fn](...args,value?{value:ethers.utils.parseEther(String(value))}:{});
    toast("Sent. Waiting for confirmation.");await tx.wait();
  }else await new Promise(r=>setTimeout(r,500));
}
async function need(){if(!S.acct)await connect();return !!S.acct}

function donate(id){
  const c=C.find(x=>x.id===id);
  if(c.paused)return toast("The platform has paused this campaign.");$("#dtitle").textContent=c.title;$("#dlg").showModal();
  $("#dform").onsubmit=async e=>{
    if(e.submitter.value!=="go")return;
    const v=Math.floor(+$("#damt").value);if(!(v>0))return toast("Enter an amount above zero.");
    if(!(await need()))return;
    try{await send("donate",[id],v);c.raised+=v;c.mine+=v;toast(`Donated ${v} POL. You now hold ${c.mine} votes here.`);route()}
    catch(err){toast("Donation failed: "+(err.reason||err.message||"unknown error"))}
  };
}
async function vote(cid,mi,yes){
  const c=C.find(x=>x.id===cid),m=c.ms[mi];
  try{await send("voteOnMilestone",[cid,mi,yes])}catch(err){return toast("Vote failed: "+(err.reason||err.message))}
  S.voted[cid+"-"+mi]=yes;if(yes)m.yes+=c.mine;else m.no+=c.mine;
  toast(yes?"You approved this payout.":"You flagged this receipt.");
  if(m.yes>c.raised/2&&m.yes>m.no){m.st="disbursed";const nx=c.ms[mi+1];if(nx&&nx.st==="locked")nx.st="pending";toast("More than half of all funds approved. Payout sent.")}
  route();
}

const lbl={disbursed:"PAID",voting:"VOTING",pending:"AWAITING RECEIPT",locked:"LOCKED"};
const line=m=>`<div class="ln ${m.st==="disbursed"?"done":m.st==="voting"?"vote":""}"><span>${esc(m.n)}</span><i></i><span>${m.amt}</span></div>${m.st==="locked"?"":`<div style="text-align:right"><span class="stamp ${m.st==="disbursed"?"ok":""}">${lbl[m.st]}</span></div>`}`;
function receipt(c,extra="",cls=""){
  const p=Math.min(100,Math.round(c.raised/c.target*100));
  return `<article class="rcpt ${cls}"><h3>${esc(c.title)}</h3><div class="by">NGO: ${esc(c.ngo)}<br>Campaign #${String(c.id).padStart(4,"0")}${c.paused?' <span class="stamp">PAUSED</span>':""}</div>
  ${c.ms.map(line).join("")}
  <div class="tot"><span>RAISED</span><span>${c.raised} / ${c.target} POL</span></div>
  <div class="meter" style="--p:${p}%" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"></div>${extra}</article>`;
}
function explore(){
  return `<section class="hero"><div>
    <h1>Your money. Their receipts. Your vote.</h1>
    <p>You fund a water project. The NGO uploads the receipt for each purchase. The people who donated vote on it. Pass, and the next payout goes out by itself.</p>
    <a class="btn go" href="#portfolio" style="text-decoration:none;display:inline-block">See my donations</a></div>
    <article class="rcpt tilt"><h3>How a payout works</h3><div class="by">1 POL donated = 1 vote</div>
    <div class="ln"><span>NGO posts receipt</span><i></i><span>Day 0</span></div>
    <div class="ln"><span>Donors vote</span><i></i><span>24 h</span></div>
    <div class="ln"><span>Over half say yes</span><i></i><span>PAID</span></div>
    <div class="ln"><span>Otherwise</span><i></i><span>HELD</span></div>
    <div class="stub">Amounts in each campaign are in POL.</div><div style="text-align:right"><span class="stamp ok">NO AUDITOR</span></div></article></section>
    <h2>Open campaigns</h2><p class="sub">Each line is a payout that stays locked until donors approve its receipt.</p>
    <div class="rack">${C.map(c=>receipt(c,`<button class="btn go" onclick="donate(${c.id})">Donate to this campaign</button>`)).join("")}</div>`;
}
function portfolio(){
  if(!S.acct)return `<div class="empty"><h2>Donor dashboard</h2><p class="sub">Connect your wallet to see which campaigns you back and which receipts are waiting for your vote.</p><button class="btn go" onclick="connect()">Connect wallet</button></div>`;
  const mine=C.filter(c=>c.mine>0),tot=mine.reduce((a,c)=>a+c.mine,0),votes=Object.keys(S.voted).length+7;
  const pend=mine.reduce((a,c)=>a+c.ms.filter((m,i)=>m.st==="voting"&&S.voted[c.id+"-"+i]===undefined).length,0);
  const body=mine.map(c=>{
    const vi=c.ms.findIndex(m=>m.st==="voting"),m=vi>=0?c.ms[vi]:null;let x=`<div class="stub">You gave ${c.mine} POL, ${Math.round(c.mine/c.raised*100)}% of this campaign.</div>`;
    if(m){
      const t=m.yes+m.no,y=t?Math.round(m.yes/t*100):0,done=S.voted[c.id+"-"+vi];
      x+=`<div class="vbox"><strong>Receipt for “${esc(m.n)}”</strong><br><a href="https://ipfs.io/" target="_blank" rel="noopener">Open the store receipt on IPFS</a>
      <div class="tally" aria-hidden="true"><i style="width:${y}%;background:#7fd6a6"></i><i style="width:${100-y}%;background:#ff9d86"></i></div>
      <div class="stub" style="margin:0">${t?`${y}% yes, ${100-y}% no. `:"No votes yet. "}Your vote weighs ${c.mine}.</div>
      ${done===undefined?`<div style="display:grid;gap:8px;margin-top:10px"><button class="btn yes" onclick="vote(${c.id},${vi},true)">Receipt is real, pay out</button><button class="btn no" onclick="vote(${c.id},${vi},false)">Reject and flag fraud</button></div>`:`<p style="margin:10px 0 0"><strong>You voted ${done?"yes":"no"}. Votes are final.</strong></p>`}</div>`;
    }
    return receipt(c,x);
  }).join("");
  return `<h2>Donor dashboard</h2><p class="sub">Wallet ${short(S.acct)}${S.demo?" (demo data)":""}</p>
    <div class="big"><div><b>${tot}</b><span>POL given</span></div><div><b>${mine.length}</b><span>campaigns backed</span></div><div><b>${votes}</b><span>votes cast</span></div><div><b>${pend}</b><span>waiting on you</span></div></div>
    <div class="rack">${body||'<p class="empty">You haven’t backed a campaign yet. Pick one under Campaigns.</p>'}</div>`;
}
let draftMs=2;
function create(){
  const rows=Array.from({length:draftMs},(_,i)=>`<div class="msrow"><input name="md${i}" placeholder="Milestone ${i+1}: what gets bought?" required><input name="ma${i}" type="number" min="1" placeholder="POL" required></div>`).join("");
  return `<h2>Start a campaign</h2><p class="sub">Break the work into payouts. Donors vote on the receipt for each one before the NGO is paid.</p>
  <form class="f" id="cform">
    <label>Title<input name="title" required placeholder="Handpumps for Ward 9"></label>
    <label>Story (stored on IPFS when you publish)<textarea name="story" rows="4" placeholder="Who needs water, and what will this fix?"></textarea></label>
    <label>Funding target in POL<input name="target" type="number" min="1" required></label>
    <label>Seed advance in percent, paid before any vote<input name="seed" type="number" min="0" max="50" value="10"></label>
    <fieldset><legend>Milestones</legend>${rows}<button type="button" class="btn" onclick="draftMs++;route()">Add milestone</button></fieldset>
    <button class="btn go" style="justify-self:start">Publish campaign</button>
  </form>`;
}
async function publish(e){
  e.preventDefault();if(!(await need()))return;
  const f=new FormData(e.target),ms=[];
  for(let i=0;i<draftMs;i++)ms.push({n:f.get("md"+i),amt:+f.get("ma"+i),st:i?"locked":"pending"});
  const target=+f.get("target");
  if(ms.reduce((a,m)=>a+m.amt,0)>target)return toast("Milestones add up to more than your target.");
  try{await send("createCampaign",["ipfs-pending",target,+f.get("seed"),ms.map(m=>m.n),ms.map(m=>m.amt)])}catch(err){return toast("Could not publish: "+(err.reason||err.message))}
  C.unshift({id:C.length+1,title:f.get("title"),ngo:short(S.acct),own:true,raised:0,target,mine:0,ms});
  draftMs=2;toast("Campaign published.");route();
}
const isAdmin=()=>S.demo||(CONFIG.admin&&S.acct&&S.acct.toLowerCase()===CONFIG.admin.toLowerCase());
const gate=(t,msg)=>`<div class="empty"><h2>${t}</h2><p class="sub">${msg}</p>${S.acct?"":'<button class="btn go" onclick="connect()">Connect wallet</button>'}</div>`;
async function proof(cid,mi){
  const f=$("#pf"+cid+"-"+mi);if(!f||!f.files.length)return toast("Choose the receipt photo or PDF first.");
  const m=C.find(x=>x.id===cid).ms[mi];
  try{await send("submitProof",[cid,mi,"bafy-demo-"+f.files[0].name])}catch(err){return toast("Could not submit: "+(err.reason||err.message))}
  m.st="voting";m.yes=0;m.no=0;toast("Receipt submitted. Donors have 24 hours to vote.");route();
}
async function claim(cid,mi){
  const c=C.find(x=>x.id===cid),m=c.ms[mi];
  if(c.raised<m.amt)return toast(`The seed advance unlocks at ${m.amt} POL raised.`);
  try{await send("claimSeedAdvance",[cid])}catch(err){return toast("Claim failed: "+(err.reason||err.message))}
  m.st="disbursed";const nx=c.ms[mi+1];if(nx&&nx.st==="locked")nx.st="pending";toast("Seed advance sent to your wallet.");route();
}
function ngoSet(i,s){S.ngos[i].st=s;toast(s==="approved"?"NGO verified. It can now start campaigns.":"Application rejected.");route()}
function pause(id){const c=C.find(x=>x.id===id);c.paused=!c.paused;toast(c.paused?"Campaign paused. Donations are blocked.":"Campaign resumed.");route()}
function ngo(){
  if(!S.acct)return gate("NGO dashboard","Connect the wallet your NGO registered with to run campaigns and submit receipts.");
  const mine=C.filter(c=>c.own),raised=mine.reduce((a,c)=>a+c.raised,0);
  const due=mine.reduce((a,c)=>a+c.ms.filter(m=>m.st==="pending").length,0),vt=mine.reduce((a,c)=>a+c.ms.filter(m=>m.st==="voting").length,0);
  const cards=mine.map(c=>{
    const mi=c.ms.findIndex(m=>m.st==="pending"),m=mi>=0?c.ms[mi]:null,vi=c.ms.findIndex(m=>m.st==="voting");let x="";
    if(m&&m.seed)x=`<div class="vbox"><strong>Seed advance</strong><div class="stub" style="margin:4px 0 0">Unlocks once ${m.amt} POL is raised. Now at ${c.raised}.</div><button class="btn go" onclick="claim(${c.id},${mi})">Claim seed advance</button></div>`;
    else if(m)x=`<div class="vbox"><strong>Next payout: ${esc(m.n)}</strong><div class="stub" style="margin:4px 0 8px">Upload the store receipt. Donors then vote for 24 hours.</div><input id="pf${c.id}-${mi}" type="file" accept="image/*,.pdf" aria-label="Receipt file"><button class="btn go" onclick="proof(${c.id},${mi})">Submit receipt</button></div>`;
    if(vi>=0){const v=c.ms[vi];x+=`<div class="vbox"><strong>Donors are voting on ${esc(v.n)}</strong><div class="stub" style="margin:4px 0 0">${v.yes} yes, ${v.no} no, by weight. A payout needs more than ${Math.floor(c.raised/2)} yes.</div></div>`}
    return receipt(c,x);
  }).join("");
  return `<h2>NGO dashboard</h2><p class="sub">Wallet ${short(S.acct)}${S.demo?" (demo data)":""}. Each payout stays locked until your donors approve its receipt.</p>
  <div class="big"><div><b>${mine.length}</b><span>campaigns</span></div><div><b>${raised}</b><span>POL raised</span></div><div><b>${due}</b><span>receipts to submit</span></div><div><b>${vt}</b><span>in donor vote</span></div></div>
  <div class="rack">${cards||'<p class="empty">No campaigns yet. Start one below.</p>'}</div>
  <div style="margin-top:56px">${create()}</div>`;
}
function admin(){
  if(!S.acct)return gate("Admin dashboard","Connect the platform admin wallet.");
  if(!isAdmin())return gate("Admin dashboard","This wallet isn’t the platform admin, so there is nothing to show.");
  const raised=C.reduce((a,c)=>a+c.raised,0),flags=[];
  C.forEach(c=>c.ms.forEach(m=>{if(m.st==="voting"&&m.no>m.yes)flags.push({c,m})}));
  const apps=S.ngos.map((n,i)=>`<div class="ln"><span>${esc(n.name)}</span><i></i><span>${n.w}</span></div>${n.st==="pending"?`<div style="display:flex;gap:8px;margin:6px 0 12px"><button class="btn yes" onclick="ngoSet(${i},'approved')">Verify</button><button class="btn no" onclick="ngoSet(${i},'rejected')">Reject</button></div>`:`<div style="text-align:right"><span class="stamp ${n.st==="approved"?"ok":""}">${n.st==="approved"?"VERIFIED":"REJECTED"}</span></div>`}`).join("");
  const rows=C.map(c=>`<div class="ln"><span>#${c.id} ${esc(c.title)}</span><i></i><span>${c.raised}</span></div><div style="text-align:right">${c.paused?'<span class="stamp">PAUSED</span> ':""}<button class="btn" style="width:auto;padding:2px 10px;margin:4px 0 10px;box-shadow:none" onclick="pause(${c.id})">${c.paused?"Resume":"Pause"}</button></div>`).join("");
  const fl=flags.length?flags.map(({c,m})=>`<div class="ln"><span>${esc(c.title)}: ${esc(m.n)}</span><i></i><span>${m.no} no</span></div><div class="stub" style="margin:0 0 8px">NGO: ${esc(c.ngo)}</div>`).join(""):'<div class="stub">Nothing flagged right now.</div>';
  return `<h2>Admin dashboard</h2><p class="sub">Platform oversight. Admins verify NGOs and can pause a campaign. They can’t move donor funds or vote on receipts.</p>
  <div class="big"><div><b>${S.ngos.filter(n=>n.st==="approved").length}</b><span>verified NGOs</span></div><div><b>${C.length}</b><span>campaigns</span></div><div><b>${raised}</b><span>POL raised</span></div><div><b>${flags.length}</b><span>flagged by donors</span></div></div>
  <div class="rack"><article class="rcpt"><h3>NGO applications</h3><div class="by">Only verified NGOs can start campaigns</div>${apps}</article>
  <article class="rcpt"><h3>All campaigns</h3><div class="by">Raised, in POL</div>${rows}<div class="tot"><span>TOTAL</span><span>${raised} POL</span></div></article>
  <article class="rcpt"><h3>Flagged by donors</h3><div class="by">Milestones where no votes lead</div>${fl}</article></div>`;
}
const views={explore,portfolio,ngo,admin};
function route(){
  const h=location.hash.slice(1),v=views[h]?h:"explore";
  $("#app").innerHTML=views[v]();
  document.querySelectorAll("nav a").forEach(a=>a.dataset.v===v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  const f=$("#cform");if(f)f.onsubmit=publish;
}
$("#connect").onclick=connect;
addEventListener("hashchange",()=>{scrollTo(0,0);route()});
route();
</script>
</body>
</html>
